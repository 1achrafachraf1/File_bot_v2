<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>FileBox</title>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>

<body>

<header>

    <div>
        <h1 id="siteName">FileBox</h1>

        <div class="status">
            <span id="statusDot"></span>
            <span id="statusText">
                جاري الاتصال...
            </span>
        </div>
    </div>

</header>


<main>

    <div class="searchArea">

        <input
            id="searchInput"
            type="search"
            placeholder="🔎 ابحث عن ملف..."
        >

        <button id="refreshBtn">
            🔄 تحديث
        </button>

    </div>


    <div
        id="notice"
        class="hidden"
    ></div>


    <div
        id="loading"
    >
        جاري تحميل الملفات...
    </div>


    <div
        id="empty"
        class="hidden"
    >
        📂 لا توجد ملفات حالياً
    </div>


    <section
        id="filesContainer"
        class="filesGrid"
    ></section>

</main>


<footer>

    © <span id="footerName">
        FileBox
    </span>

</footer>


<script src="config.js"></script>
<script src="script.js"></script>

</body>

</html>
